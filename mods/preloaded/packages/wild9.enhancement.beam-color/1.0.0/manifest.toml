label = "Beam color"
description = "Color of the normal Rig beam."
type = "choice"
default = "blue"

[[option.choice]]
value = "blue"
label = "Blue (original)"

[[option.choice]]
value = "green"
label = "Green"

[[option.choice]]
value = "yellow"
label = "Yellow"

[[option.choice]]
value = "violet"
label = "Violet"

[[option.choice]]
value = "purple"
label = "Purple"

[[plugin]]
feature = "beam_color"
id = "wild9.beamcolor"
