format_version = 6
id = "wild9.enhancement.brightness"
version = "1.0.0"
name = "Enhanced Environment Brightness"
author = "Wild9Recomp"
description = "Adjusts final display gamma in the OpenGL presentation stage to lift shadows and mid-tones without modifying guest rendering state, textures, or recompiled game code."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00425"

[[feature]]
id = "brightness"
name = "Enhanced Environment Brightness"
description = "Adjusts runtime display gamma in the OpenGL presentation stage after frame rendering. Lifts shadows and mid-tones on game content without modifying guest rendering state, textures, or recompiled code."
group = "Graphics"
default_enabled = false

[[option]]
feature = "brightness"
id = "gamma"
label = "Display Gamma"
description = "Selects runtime post-process display gamma in the presentation stage (1.00 = vanilla, >1.00 = brighter shadows and mid-tones)."
type = "choice"
default = "1.30"

