type = "boolean"
default = "false"

[[option]]
feature = "cheats"
id = "moon_jump"
label = "Moon Jump"
description = "Hold Jump (X) to float / rise indefinitely."
group = "General"
type = "boolean"
default = "false"

[[option]]
feature = "cheats"
id = "drench_infinite_health"
label = "Infinite Health"
description = "Restores health to maximum (17) in the Drench level."
