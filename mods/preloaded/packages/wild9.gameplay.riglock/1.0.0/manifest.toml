format_version = 7
id = "wild9.gameplay.riglock"
version = "1.0.0"
name = "Rig Overhead Hover"
author = "Wild9Recomp"
description = "While the Rig is holding an object, holding R2 + L2 together lifts it above the player's head and keeps it hovering there while he moves."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00425"

[[feature]]
id = "rig_lock"
name = "Rig Overhead Hover"
description = "While the Rig is holding an object, holding R2 + L2 together holds it above the player's head and follows him. Releasing the triggers restores the original behaviour."
group = "Gameplay"
default_enabled = false

[[option]]
feature = "rig_lock"
id = "height_offset"
label = "Overhead distance"
description = "How far above the player's head the object is held when R2 + L2 are both held, in game units (4096 = 1 unit)."
group = "Distances"
type = "integer"
min = 2000
max = 5000
step = 50
default = 2400

[[plugin]]
feature = "rig_lock"
id = "wild9.riglock"
