format_version = 7
id = "wild9.gameplay.rig-range"
version = "1.0.0"
name = "Rig Beam Range"
author = "Wild9Recomp"
description = "Changes the Rig beam length, from half the original up to five times as long."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SLUS-00425"

[[feature]]
id = "rig_range"
name = "Rig Beam Range"
description = "Scales how far the Rig beam reaches, from half the original length up to five times as long. With a longer beam, held objects and enemies stay where they were grabbed unless they would leave the screen, far grabs break free later, and Wex can let out more rope on anchor points."
group = "Gameplay"
default_enabled = false

[[option]]
feature = "rig_range"
id = "range_percent"
label = "Beam length"
description = "Rig beam length as a percentage of the original (50 = half, 100 = vanilla, 500 = five times as long)."
type = "integer"
min = 50
max = 500
step = 10
default = 100

[[plugin]]
feature = "rig_range"
id = "wild9.rigrange"
