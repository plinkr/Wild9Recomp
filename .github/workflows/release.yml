name: Release builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version (e.g. 0.1.0 or v0.1.0). Leave empty to auto-bump
          from the latest vX.Y.Z git tag (see bump).
        required: false
        type: string
        default: ''
      bump:
        description: 'When version is empty, which semver component to increment'
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      publish:
        description: 'Create git tag vX.Y.Z and GitHub Release'
        required: true
        type: boolean
        default: true
      cache_generated:
        description: >-
          Cache generated/ between runs. Speeds up the AppImage and Windows
          product builds, but stores a recompilation of the game in Actions
          storage. Off by default.
        required: false
        type: boolean
        default: false
      reuse_cached_emitters:
        description: 'Skip emitter rebuild when build-recompiler cache hits (psxrecomp SHA)'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

concurrency:
  group: wild9-release-${{ github.event_name }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
      reuse_emitters: ${{ steps.meta.outputs.reuse_emitters }}
      product_enabled: ${{ steps.product.outputs.enabled }}
      cache_generated: ${{ steps.product.outputs.cache_generated }}
    steps:
      - name: Checkout (tags for auto-bump)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize version / tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ github.event.inputs.version }}"
            BUMP="${{ github.event.inputs.bump || 'patch' }}"
            PUBLISH="${{ github.event.inputs.publish }}"
            REUSE="${{ github.event.inputs.reuse_cached_emitters }}"
          else
            RAW="${{ github.ref_name }}"
            BUMP="patch"
            PUBLISH="true"
            REUSE="true"
          fi
          RAW="$(printf '%s' "${RAW}" | tr -d '[:space:]')"
          if [[ -z "${RAW}" ]]; then
            if [[ -x psxrecomp/tools/ci/normalize_version.sh ]]; then
              eval "$(bash psxrecomp/tools/ci/normalize_version.sh --next "${BUMP}" | grep -E '^(VERSION|TAG)=')"
              VER="${VERSION}"
              TAG="${TAG}"
            else
              LATEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 || true)"
              BASE="${LATEST#v}"
              if [[ -z "${BASE}" && -f VERSION ]]; then
                BASE="$(tr -d '[:space:]' <VERSION)"
                BASE="${BASE#v}"
              fi
              BASE="${BASE:-0.0.0}"
              BASE="${BASE%%[-+]*}"
              IFS=. read -r MA MI PA <<<"${BASE}"
              MA="${MA:-0}"; MI="${MI:-0}"; PA="${PA:-0}"
              case "${BUMP}" in
                major) MA=$((MA + 1)); MI=0; PA=0 ;;
                minor) MI=$((MI + 1)); PA=0 ;;
                *) PA=$((PA + 1)) ;;
              esac
              VER="${MA}.${MI}.${PA}"
              TAG="v${VER}"
              echo "Auto-bumped ${BUMP}: ${LATEST:-none} -> ${VER}"
            fi
          else
            VER="${RAW#v}"
            if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][A-Za-z0-9.+-]*)?$ ]]; then
              echo "::error::invalid version '${RAW}' (want X.Y.Z or vX.Y.Z)"
              exit 1
            fi
            TAG="v${VER}"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && \
             git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists -- bump again or pass an explicit version"
            exit 1
          fi
          echo "version=${VER}" >>"$GITHUB_OUTPUT"
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >>"$GITHUB_OUTPUT"
          echo "reuse_emitters=${REUSE}" >>"$GITHUB_OUTPUT"
          echo "Using version ${VER} (tag ${TAG}), publish=${PUBLISH}, reuse_emitters=${REUSE}"

      - name: Detect product-build inputs
        id: product
        shell: bash
        env:
          PSXRECOMP_GENERATED_BUNDLE_URL: ${{ secrets.PSXRECOMP_GENERATED_BUNDLE_URL }}
          PSXRECOMP_BUNDLE_TOKEN: ${{ secrets.PSXRECOMP_BUNDLE_TOKEN }}
          CACHE_GENERATED: ${{ inputs.cache_generated || false }}
        run: |
          set -euo pipefail
          ENABLED=false
          if [[ -n "${PSXRECOMP_GENERATED_BUNDLE_URL}" && -n "${PSXRECOMP_BUNDLE_TOKEN}" ]]; then
            ENABLED=true
            echo "generated/ bundle configured: product builds enabled"
          else
            echo "::notice::No generated/ bundle configured, so there is nothing to" \
                 "release. Set BOTH secrets: PSXRECOMP_GENERATED_BUNDLE_URL (the" \
                 "bundle's raw URL) and PSXRECOMP_BUNDLE_TOKEN (a read credential" \
                 "for wherever it lives). Both are required -- a token alone, or a" \
                 "URL alone, will not do. No disc image is ever needed in CI."
          fi
          echo "enabled=${ENABLED}" >>"$GITHUB_OUTPUT"
          echo "cache_generated=${CACHE_GENERATED}" >>"$GITHUB_OUTPUT"

  product-zips:
    name: ${{ matrix.artifact }}
    needs: prepare
    if: needs.prepare.outputs.product_enabled == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-x64
            shell: bash
          - os: windows-2022
            artifact: windows-x64
            shell: 'msys2 {0}'
          - os: macos-15
            artifact: macos-arm64
            shell: bash
            deployment_target: '11.0'
          - os: macos-15-intel
            artifact: macos-x64
            shell: bash
            deployment_target: '11.0'
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      ARTIFACT: ${{ matrix.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Pin VERSION
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${RELEASE_VERSION}" >VERSION
          echo "VERSION=$(cat VERSION)"

      - name: Record framework revisions
        shell: bash
        run: bash psxrecomp/tools/ci/record_pins.sh

      - name: Lint boot-EXE name consistency
        shell: bash
        run: bash psxrecomp/tools/ci/check_boot_exe.sh .

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-shaderc
            curl
            unzip
            zip

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libsdl2-dev libgl1-mesa-dev libxtst-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev zip unzip \
            libvulkan-dev curl xz-utils

      - name: Cache Vulkan SDK (Linux glslc)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .cache/vulkan-sdk
          key: vulkan-sdk-linux-x86_64-1.4.363.0

      - name: Install Vulkan SDK (Linux glslc)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          SDK_VERSION=1.4.363.0
          SDK_CACHE_ROOT="${GITHUB_WORKSPACE}/.cache/vulkan-sdk"
          SDK_ROOT="${SDK_CACHE_ROOT}/${SDK_VERSION}"
          SDK_ARCHIVE="${SDK_CACHE_ROOT}/vulkan_sdk-${SDK_VERSION}.tar.xz"
          SDK_URL="https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/linux/vulkan_sdk.tar.xz"
          SDK_SHA256="197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43"

          if [[ ! -x "${SDK_ROOT}/x86_64/bin/glslc" ]]; then
            mkdir -p "${SDK_CACHE_ROOT}"
            if [[ ! -f "${SDK_ARCHIVE}" ]]; then
              echo "Downloading Vulkan SDK ${SDK_VERSION}..."
              curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
                -o "${SDK_ARCHIVE}" "${SDK_URL}"
            fi
            echo "${SDK_SHA256}  ${SDK_ARCHIVE}" | sha256sum -c -
            rm -rf "${SDK_ROOT}"
            tar -xJf "${SDK_ARCHIVE}" -C "${SDK_CACHE_ROOT}"
          fi

          test -x "${SDK_ROOT}/x86_64/bin/glslc"
          echo "VULKAN_SDK=${SDK_ROOT}/x86_64" >>"${GITHUB_ENV}"
          echo "PATH=${SDK_ROOT}/x86_64/bin:${PATH}" >>"${GITHUB_ENV}"
          echo "Vulkan SDK ${SDK_VERSION}: ${SDK_ROOT}/x86_64"

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config sdl3 \
            vulkan-headers shaderc molten-vk \
            || brew install cmake ninja pkg-config sdl2 \
            vulkan-headers shaderc molten-vk

      - name: Point CMake at the Homebrew prefixes (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BREW_PREFIX="$(brew --prefix)"
          SHADERC_PREFIX="$(brew --prefix shaderc 2>/dev/null || true)"
          VK_HDR_PREFIX="$(brew --prefix vulkan-headers 2>/dev/null || true)"
          PREFIX_PATH="${BREW_PREFIX}"
          if [[ -n "${SHADERC_PREFIX}" ]]; then
            PREFIX_PATH="${SHADERC_PREFIX}:${PREFIX_PATH}"
          fi
          if [[ -n "${VK_HDR_PREFIX}" ]]; then
            PREFIX_PATH="${VK_HDR_PREFIX}:${PREFIX_PATH}"
          fi
          echo "CMAKE_PREFIX_PATH=${PREFIX_PATH}" >>"$GITHUB_ENV"
          echo "PATH=${SHADERC_PREFIX:+$SHADERC_PREFIX/bin:}${BREW_PREFIX}/bin:$PATH" >>"$GITHUB_ENV"
          if [[ -f "${BREW_PREFIX}/include/vulkan/vulkan.h" ]]; then
            echo "VULKAN_SDK=${BREW_PREFIX}" >>"$GITHUB_ENV"
          elif [[ -n "${VK_HDR_PREFIX}" && -f "${VK_HDR_PREFIX}/include/vulkan/vulkan.h" ]]; then
            echo "VULKAN_SDK=${VK_HDR_PREFIX}" >>"$GITHUB_ENV"
          fi

      - name: Verify Vulkan build tools
        run: |
          set -euo pipefail
          command -v glslc
          glslc --version || true
          HDR=""
          for candidate in \
              /mingw64/include/vulkan/vulkan.h \
              /usr/include/vulkan/vulkan.h \
              /opt/homebrew/include/vulkan/vulkan.h \
              /usr/local/include/vulkan/vulkan.h; do
            if [[ -f "${candidate}" ]]; then
              HDR="${candidate}"
              break
            fi
          done
          if [[ -z "${HDR}" ]] && command -v brew >/dev/null 2>&1; then
            BREW_HDR="$(brew --prefix)/include/vulkan/vulkan.h"
            if [[ -f "${BREW_HDR}" ]]; then
              HDR="${BREW_HDR}"
            fi
          fi
          if [[ -z "${HDR}" ]]; then
            echo "::error::vulkan/vulkan.h not found"
            exit 1
          fi
          echo "Found ${HDR}"

      - name: Cache SDL3 source
        if: runner.os != 'macOS'
        uses: actions/cache@v4
        with:
          path: .cache/sdl3-src
          key: sdl3-3.4.10-src

      - name: Prefetch SDL3 source
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          OUT=".cache/sdl3-src"
          sdl3_env() {
            local abs="${OUT}"
            if command -v cygpath >/dev/null 2>&1; then
              abs="$(cygpath -m "${OUT}")"
            elif [[ -d "${OUT}" ]]; then
              abs="$(cd "${OUT}" && pwd)"
            fi
            echo "PSX_SDL3_SOURCE_DIR=${abs}" >>"$GITHUB_ENV"
            echo "SDL3 source ready: ${abs}"
          }
          if [[ -f "${OUT}/CMakeLists.txt" ]]; then
            sdl3_env
            echo "SDL3 source cache hit"
            exit 0
          fi
          if [[ -f psxrecomp/tools/ci/prefetch_sdl3.sh ]]; then
            chmod +x psxrecomp/tools/ci/prefetch_sdl3.sh
            bash psxrecomp/tools/ci/prefetch_sdl3.sh --out-dir "${OUT}"
            exit 0
          fi
          echo "prefetch_sdl3.sh missing; using inline curl --http1.1"
          mkdir -p .cache
          VER=3.4.10
          SHA=12b34280415ec8418c864408b93d008a20a6530687ee613d60bfbd20411f2785
          URL="https://github.com/libsdl-org/SDL/releases/download/release-${VER}/SDL3-${VER}.tar.gz"
          TAR=".cache/SDL3-${VER}.tar.gz"
          curl -fsSL --http1.1 --retry 5 --retry-all-errors --retry-delay 2 -o "${TAR}" "${URL}"
          echo "${SHA}  ${TAR}" | sha256sum -c -
          rm -rf "${OUT}.extracting"
          mkdir -p "${OUT}.extracting"
          if tar --help 2>&1 | grep -q -- '--force-local'; then
            tar --force-local -xzf "${TAR}" -C "${OUT}.extracting"
          else
            tar -xzf "${TAR}" -C "${OUT}.extracting"
          fi
          INNER="$(find "${OUT}.extracting" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          rm -rf "${OUT}"
          mv "${INNER}" "${OUT}"
          rm -rf "${OUT}.extracting"
          sdl3_env

      - name: Fetch portable toolchain (Windows emitters)
        if: runner.os == 'Windows'
        uses: ./psxrecomp/.github/actions/fetch-toolchain
        with:
          artifact: ${{ matrix.artifact }}

      - name: Emitter cache key
        id: emitter_cache
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git -C psxrecomp rev-parse HEAD)"
          echo "key=${{ runner.os }}-${{ matrix.artifact }}-emitters-${SHA}" >>"$GITHUB_OUTPUT"
          echo "psxrecomp SHA ${SHA}"

      - name: Cache emitters (build-recompiler)
        id: cache_emitters
        uses: actions/cache@v4
        with:
          path: build-recompiler
          key: ${{ steps.emitter_cache.outputs.key }}

      - name: Build recompiler tools (emitters)
        if: >-
          steps.cache_emitters.outputs.cache-hit != 'true' ||
          needs.prepare.outputs.reuse_emitters != 'true'
        uses: ./psxrecomp/.github/actions/build-emitters

      - name: Verify emitters present
        shell: bash
        run: |
          set -euo pipefail
          count="$(find build-recompiler -type f \( -name 'psxrecomp-game*' -o -name 'psxrecomp-bios*' \) | wc -l | tr -d ' ')"
          if [[ "${count}" -lt 2 ]]; then
            echo "::error::expected psxrecomp-game + psxrecomp-bios under build-recompiler (found ${count})"
            exit 1
          fi

      - name: Setup ccache (Linux/macOS)
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: product-${{ matrix.artifact }}
          max-size: 800M

      - name: Product inputs cache key
        id: product_cache
        if: needs.prepare.outputs.cache_generated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          DISC_SHA="$("$PY" -c "import json;print(json.load(open('catalog_identity.json'))['rom_identity']['data_track']['sha1'])")"
          echo "key=product-generated-${{ matrix.artifact }}-$(git -C psxrecomp rev-parse HEAD)-${DISC_SHA}-${{ hashFiles('game.toml', 'src/mods/**') }}" >>"$GITHUB_OUTPUT"

      - name: Cache generated game C
        id: cache_generated
        if: needs.prepare.outputs.cache_generated == 'true'
        uses: actions/cache@v4
        with:
          path: generated
          key: ${{ steps.product_cache.outputs.key }}

      - name: Prepare product inputs (verified generated/)
        shell: bash
        env:
          PSXRECOMP_GENERATED_BUNDLE_URL: ${{ secrets.PSXRECOMP_GENERATED_BUNDLE_URL }}
          PSXRECOMP_BUNDLE_TOKEN: ${{ secrets.PSXRECOMP_BUNDLE_TOKEN }}
        run: scripts/ci_prepare_product_inputs.sh build-recompiler

      - name: Package product zip
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          ARTIFACT: ${{ matrix.artifact }}
          CCACHE: ${{ runner.os != 'Windows' && '1' || '0' }}
          EXTRA_CMAKE_ARGS: ${{ matrix.deployment_target && format('-DCMAKE_OSX_DEPLOYMENT_TARGET={0}', matrix.deployment_target) || '' }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION#v}"
          export OUTPUT="${GITHUB_WORKSPACE}/dist/wild9-${VERSION}-${ARTIFACT}.zip"
          sh tools/package_product_zip.sh
          ls -la dist/

      - name: Verify the product zip needs no toolchain
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(ls dist/wild9-*-${{ matrix.artifact }}.zip | head -n1)"
          echo "checking ${ZIP}"
          rm -rf zip-check
          mkdir -p zip-check
          unzip -q "${ZIP}" -d zip-check
          EXE=""
          for cand in zip-check/Wild9_Recompiled zip-check/Wild9_Recompiled.exe; do
            if [[ -f "${cand}" ]]; then EXE="${cand}"; break; fi
          done
          if [[ -z "${EXE}" ]]; then
            echo "::error::product zip has no Wild9_Recompiled executable" >&2
            exit 1
          fi
          for required in assets/fonts bios/openbios.bin game.toml; do
            if [[ ! -e "zip-check/${required}" ]]; then
              echo "::error::product zip is missing ${required}" >&2
              exit 1
            fi
          done
          for dir in toolchain overlay_toolchain cache; do
            if [[ -e "zip-check/${dir}" ]]; then
              echo "::error::product zip ships ${dir}/" >&2
              exit 1
            fi
          done
          for marker in WILD9RECOMP_PROJECT_ROOT WILD9RECOMP_BUILD_DIR \
                       WILD9RECOMP_FORCE_SETUP \
                       RetroPortingToolKit/RetroPorting-Toolchains; do
            if grep -qa "${marker}" "${EXE}"; then
              echo "::error::${ARTIFACT} executable still contains ${marker} (setup wizard)" >&2
              exit 1
            fi
          done
          grep -q '^overlay_cache = false' zip-check/game.toml \
            || { echo "::error::shipped game.toml does not disable overlay_cache" >&2; exit 1; }
          echo "${ARTIFACT} product zip verified: no wizard, no toolchain, overlay_cache off"

      - name: Verify zip ships the mod catalog
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(ls dist/wild9-*-${{ matrix.artifact }}.zip | head -n1)"
          MANIFESTS=$(unzip -l "${ZIP}" | grep -c 'mods/bundled/.*/manifest\.toml' || true)
          echo "mod manifests in zip: ${MANIFESTS}"
          if [[ "${MANIFESTS}" -lt 1 ]]; then
            echo "::error::release zip ships no mod catalog (mods/bundled/*/manifest.toml)" >&2
            unzip -l "${ZIP}" | head -40 >&2
            exit 1
          fi
          if unzip -l "${ZIP}" | grep -q 'state\.toml'; then
            echo "::error::release zip contains mods/state.toml (per-machine state)" >&2
            exit 1
          fi
          if unzip -l "${ZIP}" | grep -q 'mods/installed/'; then
            echo "::error::release zip contains mods/installed (per-machine installs)" >&2
            exit 1
          fi
          if unzip -p "${ZIP}" 'mods/**/manifest.toml' 2>/dev/null \
               | grep -Eq '^[[:space:]]*channel[[:space:]]*=[[:space:]]*"developer"'; then
            echo "::error::release zip contains developer-channel mod packages" >&2
            exit 1
          fi
          echo "mod catalog verified in ${ZIP} (no developer-channel packages)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wild9-${{ matrix.artifact }}
          path: |
            dist/wild9-*-${{ matrix.artifact }}.zip
            dist/wild9-*-${{ matrix.artifact }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

  appimage:
    name: linux-x86_64 (AppImage, no toolchain)
    needs: prepare
    if: needs.prepare.outputs.product_enabled == 'true'
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pin VERSION
        run: printf '%s\n' "${RELEASE_VERSION}" >VERSION

      - name: Record framework revisions
        run: bash psxrecomp/tools/ci/record_pins.sh

      - name: Lint boot-EXE name consistency
        run: bash psxrecomp/tools/ci/check_boot_exe.sh .

      - name: Install deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgl1-mesa-dev libxtst-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev zip unzip \
            libvulkan-dev imagemagick python3 curl file xz-utils \
            libgl-dev libglu1-mesa-dev
          sudo apt-get install -y --no-install-recommends libsdl3-dev \
            || echo "::notice::libsdl3-dev unavailable; the packager will build SDL3 from source"

      - name: Cache Vulkan SDK
        uses: actions/cache@v4
        with:
          path: .cache/vulkan-sdk
          key: vulkan-sdk-linux-x86_64-1.4.363.0

      - name: Install Vulkan SDK (glslc)
        shell: bash
        run: |
          set -euo pipefail
          SDK_VERSION=1.4.363.0
          SDK_CACHE_ROOT="${GITHUB_WORKSPACE}/.cache/vulkan-sdk"
          SDK_ROOT="${SDK_CACHE_ROOT}/${SDK_VERSION}"
          SDK_ARCHIVE="${SDK_CACHE_ROOT}/vulkan_sdk-${SDK_VERSION}.tar.xz"
          SDK_URL="https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/linux/vulkan_sdk.tar.xz"
          SDK_SHA256="197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43"

          if [[ ! -x "${SDK_ROOT}/x86_64/bin/glslc" ]]; then
            mkdir -p "${SDK_CACHE_ROOT}"
            if [[ ! -f "${SDK_ARCHIVE}" ]]; then
              echo "Downloading Vulkan SDK ${SDK_VERSION}..."
              curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
                -o "${SDK_ARCHIVE}" "${SDK_URL}"
            fi
            echo "${SDK_SHA256}  ${SDK_ARCHIVE}" | sha256sum -c -
            rm -rf "${SDK_ROOT}"
            tar -xJf "${SDK_ARCHIVE}" -C "${SDK_CACHE_ROOT}"
          fi

          test -x "${SDK_ROOT}/x86_64/bin/glslc"
          echo "VULKAN_SDK=${SDK_ROOT}/x86_64" >>"${GITHUB_ENV}"
          echo "PATH=${SDK_ROOT}/x86_64/bin:${PATH}" >>"${GITHUB_ENV}"
          echo "Vulkan SDK ${SDK_VERSION}: ${SDK_ROOT}/x86_64"

      - name: Verify Vulkan build tools
        run: |
          set -euo pipefail
          command -v glslc
          if [[ ! -f /usr/include/vulkan/vulkan.h ]]; then
            echo "::error::vulkan/vulkan.h not found" >&2
            exit 1
          fi
          glslc --version || true

      - name: Cache SDL3 source
        uses: actions/cache@v4
        with:
          path: .cache/sdl3-src
          key: sdl3-3.4.10-src

      - name: Prefetch SDL3 source
        run: |
          set -euo pipefail
          OUT=".cache/sdl3-src"
          if [[ -f psxrecomp/tools/ci/prefetch_sdl3.sh ]]; then
            bash psxrecomp/tools/ci/prefetch_sdl3.sh --out-dir "${OUT}"
          else
            echo "::error::prefetch_sdl3.sh missing from the psxrecomp submodule" >&2
            exit 1
          fi
          {
            echo "PSX_SDL3_SOURCE_DIR=${GITHUB_WORKSPACE}/.cache/sdl3-src"
          } >>"$GITHUB_ENV"

      - name: Emitter cache key
        id: emitter_cache
        run: |
          set -euo pipefail
          SHA="$(git -C psxrecomp rev-parse HEAD)"
          echo "key=appimage-emitters-${SHA}" >>"$GITHUB_OUTPUT"

      - name: Cache emitters (build-recompiler)
        id: cache_emitters
        uses: actions/cache@v4
        with:
          path: build-recompiler
          key: ${{ steps.emitter_cache.outputs.key }}

      - name: Build recompiler tools (emitters)
        if: steps.cache_emitters.outputs.cache-hit != 'true' || needs.prepare.outputs.reuse_emitters != 'true'
        uses: ./psxrecomp/.github/actions/build-emitters

      - name: Verify emitters present
        run: |
          set -euo pipefail
          for f in build-recompiler/psxrecomp-game build-recompiler/psxrecomp-bios; do
            if [[ ! -x "$f" ]]; then
              echo "::error::missing ${f}" >&2
              exit 1
            fi
          done

      - name: Product inputs cache key
        id: product_cache
        if: needs.prepare.outputs.cache_generated == 'true'
        run: |
          set -euo pipefail
          DISC_SHA="$(python3 -c "import json;print(json.load(open('catalog_identity.json'))['rom_identity']['data_track']['sha1'])")"
          echo "key=product-generated-$(git -C psxrecomp rev-parse HEAD)-${DISC_SHA}-${{ hashFiles('game.toml', 'src/mods/**') }}" >>"$GITHUB_OUTPUT"

      - name: Cache generated game C
        id: cache_generated
        if: needs.prepare.outputs.cache_generated == 'true'
        uses: actions/cache@v4
        with:
          path: generated
          key: ${{ steps.product_cache.outputs.key }}

      - name: Prepare product inputs (verified generated/)
        env:
          PSXRECOMP_GENERATED_BUNDLE_URL: ${{ secrets.PSXRECOMP_GENERATED_BUNDLE_URL }}
          PSXRECOMP_BUNDLE_TOKEN: ${{ secrets.PSXRECOMP_BUNDLE_TOKEN }}
        run: scripts/ci_prepare_product_inputs.sh build-recompiler

      - name: Cache AppImage packaging tools
        uses: actions/cache@v4
        with:
          path: build-appimage/appimage-tools
          key: appimage-packaging-tools-v1

      - name: Build the AppImage
        run: |
          sh tools/package_appimage.sh
          ls -la dist/

      - name: Verify the AppImage needs no toolchain
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$(realpath "$(ls dist/wild9-*-x86_64.AppImage)")"
          echo "checking ${APPIMAGE}"
          rm -rf /tmp/squashfs-root /tmp/appdir-check
          (cd /tmp && "${APPIMAGE}" --appimage-extract >/dev/null)
          mv /tmp/squashfs-root /tmp/appdir-check
          . tools/product_build_verify.sh
          psx_verify_product_build /tmp/appdir-check/usr/bin/Wild9_Recompiled \
              "$GITHUB_WORKSPACE/build-appimage-configure.log"
          psx_product_verify_no_toolchain_payload /tmp/appdir-check/usr/share/wild9recomp
          echo "AppImage verified: game C linked, no wizard, no toolchain"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wild9-appimage
          path: |
            dist/wild9-*-x86_64.AppImage
            dist/wild9-*-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: [prepare, product-zips, appimage]
    if: >-
      always() &&
      needs.prepare.outputs.publish == 'true' &&
      needs.prepare.outputs.product_enabled == 'true' &&
      (needs.product-zips.result == 'success' || needs.product-zips.result == 'skipped') &&
      (needs.appimage.result == 'success' || needs.appimage.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (for tagging + git-cliff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Collect release assets
        id: assets
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name 'wild9-*.zip' -o -name 'wild9-*.AppImage' \) \
            -exec cp -v {} dist/ \;
          find artifacts -type f -name '*.sha256' -exec cp -v {} dist/ \; || true
          ls -la dist/
          mapfile -t FILES < <(find dist -maxdepth 1 -type f | sort)
          if [[ "${#FILES[@]}" -eq 0 ]]; then
            echo "::error::no release artifacts were produced" >&2
            exit 1
          fi
          echo "Found ${#FILES[@]} release asset(s):"
          printf '  %s\n' "${FILES[@]}"
          {
            echo 'files<<EOF'
            printf '%s\n' "${FILES[@]}"
            echo EOF
          } >>"$GITHUB_OUTPUT"

      - name: Ensure release tag exists
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git tag -a "${TAG}" -m "Wild9 Recompiled ${TAG}"
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git push origin "refs/tags/${TAG}"
          fi

      - name: Determine previous tag
        id: prevtag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet || true
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)"
          if [[ -z "${PREV}" ]]; then
            PREV="$(git rev-list --max-parents=0 HEAD | tail -n1)"
            echo "No previous tag; using first commit ${PREV}"
          else
            echo "Previous tag: ${PREV}"
          fi
          echo "prev=${PREV}" >>"$GITHUB_OUTPUT"

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes with git-cliff
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          PREV_TAG: ${{ steps.prevtag.outputs.prev }}
        run: |
          set -euo pipefail
          git-cliff -c ./cliff.toml "${PREV_TAG}..${TAG}" -o release-notes.md
          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Wild9 Recompiled ${{ needs.prepare.outputs.tag }}"
          body_path: release-notes.md
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
